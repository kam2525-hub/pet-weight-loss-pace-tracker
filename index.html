<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛犬・愛猫のダイエット目標体重逆算シミュレーター</title>
    <style>
        :root {
            --primary: #ff6b81;
            --primary-light: #ff8e9e;
            --primary-dark: #e05267;
            --secondary: #48dbfb;
            --accent: #ff9f43;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --border-color: #dfe6e9;
            --success: #1dd1a1;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .icon-svg {
            width: 48px;
            height: 48px;
            fill: var(--primary);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .label-hint {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: normal;
            margin-left: 5px;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .radio-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .radio-card input[type="radio"] {
            display: none;
        }

        .radio-card.active {
            border-color: var(--primary);
            background-color: rgba(255, 107, 129, 0.05);
            color: var(--primary);
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        .input-with-unit {
            position: relative;
        }

        .input-with-unit span {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* 結果表示エリア */
        #resultArea {
            display: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .result-header h2 {
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-box {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .metric-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .metric-value span {
            font-size: 0.9rem;
            font-weight: normal;
        }

        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-box.danger {
            background-color: #ff8e9e15;
            border-left-color: var(--primary);
        }

        .timeline-section {
            margin-top: 25px;
        }

        .timeline-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid var(--border-color);
            margin-left: 10px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary);
            border: 2px solid #fff;
        }

        .timeline-date {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .timeline-content {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .reset-link {
            text-align: center;
            margin-top: 15px;
        }

        .reset-link button {
            background: none;
            border: none;
            color: var(--text-sub);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <!-- 猫と犬を合わせたシンプルなSVGアイコン -->
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M12,4C15.87,4 19,7.13 19,11C19,12.38 18.59,13.67 17.88,14.73C17.43,13.73 16.44,13 15.25,13H14V11C14,9.9 13.1,9 12,9C10.9,9 10,9.9 10,11V13H8.75C7.56,13 6.57,13.73 6.12,14.73C5.41,13.67 5,12.38 5,11C5,7.13 8.13,4 12,4M12,15C13.66,15 15,16.34 15,18C15,19.66 13.66,21 12,21C10.34,21 9,19.66 9,18C9,16.34 10.34,15 12,15Z"/>
            </svg>
            <h1>ダイエット目標体重逆算シミュレーター</h1>
        </div>
        <p class="subtitle">動物病院の指示に基づく、安全で確実な減量プランを作成します</p>
    </header>

    <!-- 入力フォームカード -->
    <div class="card" id="inputCard">
        <form id="dietForm">
            <!-- ペットの種類 -->
            <div class="form-group">
                <label>ペットの種類</label>
                <div class="radio-group">
                    <label class="radio-card active" id="labelDog">
                        <input type="radio" name="petType" value="dog" checked> イヌ
                    </label>
                    <label class="radio-card" id="labelCat">
                        <input type="radio" name="petType" value="cat"> ネコ
                    </label>
                </div>
            </div>

            <!-- 現在の体重 -->
            <div class="form-group">
                <label for="currentWeight">現在の体重 <span class="label-hint">現在の実測値</span></label>
                <div class="input-with-unit">
                    <input type="number" id="currentWeight" step="0.05" min="0.5" max="100" placeholder="例: 5.4" required>
                    <span>kg</span>
                </div>
            </div>

            <!-- 目標の体重 -->
            <div class="form-group">
                <label for="targetWeight">目標の体重 <span class="label-hint">病院で指示された体重</span></label>
                <div class="input-with-unit">
                    <input type="number" id="targetWeight" step="0.05" min="0.5" max="100" placeholder="例: 4.5" required>
                    <span>kg</span>
                </div>
            </div>

            <!-- 避妊・去勢の有無 -->
            <div class="form-group">
                <label for="neuterStatus">避妊・去勢手術</label>
                <select id="neuterStatus">
                    <option value="yes">あり（避妊・去勢済み）</option>
                    <option value="no">なし（未避妊・未去勢）</option>
                </select>
            </div>

            <!-- ご飯のカロリー -->
            <div class="form-group">
                <label for="foodKcal">現在のフードのカロリー <span class="label-hint">100gあたり</span></label>
                <div class="input-with-unit">
                    <input type="number" id="foodKcal" step="1" min="200" max="600" placeholder="例: 350" required>
                    <span>kcal / 100g</span>
                </div>
            </div>

            <button type="submit" class="btn">減量プランを計算する</button>
        </form>
    </div>

    <!-- 結果表示カード -->
    <div class="card" id="resultArea">
        <div class="result-header">
            <h2>診断結果・減量プラン</h2>
            <p id="resultSubtitle" class="subtitle">無理なく健康的に痩せるためのロードマップです</p>
        </div>

        <div id="safetyAlert" class="alert-box">
            <!-- 警告メッセージが動的に入ります -->
        </div>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-title">目標までの過剰体重</div>
                <div class="metric-value" id="excessWeight">-</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">推奨される毎日の食事量</div>
                <div class="metric-value" id="dailyFood">-</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">目標達成の目安期間</div>
                <div class="metric-value" id="estimatedWeeks">-</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">減量中の1日あたりカロリー</div>
                <div class="metric-value" id="targetKcal">-</div>
            </div>
        </div>

        <div class="timeline-section">
            <div class="timeline-title">体重測定スケジュール目安</div>
            <div class="timeline" id="timelineList">
                <!-- タイムラインが動的に入ります -->
            </div>
        </div>

        <div class="reset-link">
            <button id="recalcBtn">← 条件を変更して再計算する</button>
        </div>
    </div>
</div>

<script>
    // ラジオボタンのUI切り替え制御
    const radioCards = document.querySelectorAll('.radio-card');
    radioCards.forEach(card => {
        card.addEventListener('click', () => {
            radioCards.forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            const radio = card.querySelector('input[type="radio"]');
            radio.checked = true;
        });
    });

    // フォーム要素
    const dietForm = document.getElementById('dietForm');
    const inputCard = document.getElementById('inputCard');
    const resultArea = document.getElementById('resultArea');
    const recalcBtn = document.getElementById('recalcBtn');

    // ローカルストレージキー
    const STORAGE_KEY = 'pet_diet_simulator_data_v1';

    // ページロード時に保存データを復元
    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            try {
                const data = JSON.parse(savedData);
                document.querySelector(`input[name="petType"][value="${data.petType}"]`).checked = true;
                radioCards.forEach(c => c.classList.remove('active'));
                document.querySelector(`input[name="petType"][value="${data.petType}"]`).closest('.radio-card').classList.add('active');
                
                document.getElementById('currentWeight').value = data.currentWeight;
                document.getElementById('targetWeight').value = data.targetWeight;
                document.getElementById('neuterStatus').value = data.neuterStatus;
                document.getElementById('foodKcal').value = data.foodKcal;

                // 自動で計算を実行
                calculateDiet(data);
            } catch (e) {
                console.error('Failed to load saved data', e);
            }
        }
    });

    // フォーム送信時
    dietForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const formData = {
            petType: document.querySelector('input[name="petType"]:checked').value,
            currentWeight: parseFloat(document.getElementById('currentWeight').value),
            targetWeight: parseFloat(document.getElementById('targetWeight').value),
            neuterStatus: document.getElementById('neuterStatus').value,
            foodKcal: parseFloat(document.getElementById('foodKcal').value)
        };

        // バリデーション
        if (formData.currentWeight <= formData.targetWeight) {
            alert('目標体重は現在の体重よりも軽い値を設定してください。');
            return;
        }

        // 保存
        localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));

        // 計算実行
        calculateDiet(formData);
    });

    // 再計算ボタン
    recalcBtn.addEventListener('click', () => {
        resultArea.style.display = 'none';
        inputCard.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 計算ロジック
    function calculateDiet(data) {
        const excess = data.currentWeight - data.targetWeight; // 減らすべき体重 (kg)
        
        // 安全な減量ペース: 猫・犬ともに週に体重の0.5%〜1.0%程度が安全。
        // ここでは安全のため週に 0.8% 減を基準とする
        const weeklyLossRate = 0.008; 
        const weeklyLossKg = data.currentWeight * weeklyLossRate;
        const totalWeeks = Math.ceil(excess / weeklyLossKg);
        const totalMonths = (totalWeeks / 4.3).toFixed(1);

        // 基礎代謝量 (RER) の計算: 70 * (目標体重kg)^0.75
        // 減量期は「目標体重ベース」または「現在の体重の少し下」でRERを計算するのが安全だが、
        // 一般的な減量期RER係数を使用。減量中の係数は犬:1.0〜1.2、猫:0.8〜1.0程度
        let rer = 70 * Math.pow(data.targetWeight, 0.75);
        
        let maintenanceFactor = 1.2; // 避妊去勢済みの標準
        if (data.petType === 'dog') {
            maintenanceFactor = data.neuterStatus === 'yes' ? 1.6 : 1.8;
        } else {
            maintenanceFactor = data.neuterStatus === 'yes' ? 1.2 : 1.4;
        }

        // 維持カロリー
        const maintenanceKcal = rer * maintenanceFactor;

        // 減量カロリー（維持カロリーの80%程度、または目標体重のRER×係数）
        // 安全かつ確実な減量のため、目標体重に対するRER × 減量係数(犬1.0 / 猫0.8)を採用
        let dietKcalFactor = data.petType === 'dog' ? 1.0 : 0.8;
        let targetDailyKcal = rer * dietKcalFactor;

        // あまりにも少なすぎる場合の安全装置（RERを下回る極端な絶食系ダイエットを防ぐ）
        if (targetDailyKcal < rer * 0.8) {
            targetDailyKcal = rer * 0.8;
        }

        // 1日のごはんのグラム数
        const dailyFoodGrams = (targetDailyKcal / data.foodKcal) * 100;

        // 画面反映
        document.getElementById('excessWeight').innerHTML = `${excess.toFixed(2)} <span>kg</span>`;
        document.getElementById('dailyFood').innerHTML = `${Math.round(dailyFoodGrams)} <span>g / 日</span>`;
        document.getElementById('estimatedWeeks').innerHTML = `${totalWeeks} <span>週 (約${totalMonths}ヶ月)</span>`;
        document.getElementById('targetKcal').innerHTML = `${Math.round(targetDailyKcal)} <span>kcal / 日</span>`;

        // アラートメッセージの作成
        const alertBox = document.getElementById('safetyAlert');
        if (excess / data.currentWeight > 0.3) {
            alertBox.className = 'alert-box danger';
            alertBox.innerHTML = '<strong>【注意】</strong> 減量割合が現在の体重の30%を超えています。急激なダイエットは肝リピドーシス（猫）や体調不良を引き起こすリスクがあるため、必ずかかりつけの動物病院の指導のもとで進めてください。';
        } else {
            alertBox.className = 'alert-box';
            alertBox.innerHTML = '<strong>【安全なペース】</strong> このプランは週に約0.8%の緩やかなペースで減量します。おやつを与える場合は、上記のフード量からおやつのカロリー分を必ず差し引いてください。';
        }

        // タイムライン生成
        const timelineList = document.getElementById('timelineList');
        timelineList.innerHTML = '';

        const steps = 4;
        for (let i = 1; i <= steps; i++) {
            const stepWeeks = Math.round((totalWeeks / steps) * i);
            const expectedWeight = Math.max(data.targetWeight, data.currentWeight - (weeklyLossKg * (totalWeeks / steps) * i));
            
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.innerHTML = `
                <div class="timeline-date">経過目安: 約 ${stepWeeks} 週間後</div>
                <div class="timeline-content">目標体重: ${expectedWeight.toFixed(2)} kg 頃</div>
            `;
            timelineList.appendChild(item);
        }

        // 画面切り替え
        inputCard.style.display = 'none';
        resultArea.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
